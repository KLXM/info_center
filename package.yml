package: info_center
version: '1.0.0-dev'
author: 'KLXM Crossmedia GmbH'
supportpage: https://github.com/klxm/info_center

load: late

requires:
    redaxo: '^5.18.0'
    php:
        version: '>=8.1'
    packages:
        structure: '^2.0.0'
        quick_navigation: '*'

pages:
    info_center:
        title: 'translate:info_center_title'
        perm: info_center[]
        subpages:
            config:
                title: 'translate:info_center_settings'
                perm: info_center[config]
            messaging:
                title: 'translate:messaging_title'
                perm: info_center[]
                hidden: true

default_config:
    darkmode: auto
    position: right
    widgets:
        url:
            enabled: true
            prio: -1
        timetracker:
            enabled: true
            prio: 0
        article:
            enabled: true 
            prio: 1
        upkeep:
            enabled: true
            prio: 2
        messaging:
            enabled: true
            prio: 3
        stats:
            enabled: true
            prio: 5
        system:
            enabled: true
            prio: 10

default_permissions:
    info_center: 'Info Center'
    info_center[config]: 'Info Center Settings'

conflicts:
    packages:
        minibar: '*'
