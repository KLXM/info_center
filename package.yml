package: info_center
version: '1.0.0-dev'
author: 'KLXM Crossmedia GmbH'
supportpage: https://github.com/klxm/info_center

load: late

requires:
    redaxo: '^5.18.0'
    php:
        version: '>=8.1'
    packages:
        structure: '^2.0.0'

default_config:
    darkmode: auto
    position: right
    widgets:
        system:
            enabled: true
            prio: 10
        article:
            enabled: true 
            prio: 20
        upkeep:
            enabled: true
            prio: 30

conflicts:
    packages:
        minibar: '*'
